name: Atualizador Meteorologico automatico

on:
  schedule:
    - cron: '0 * * * *' # Roda automaticamente a cada 1 hora
  workflow_dispatch: # Permite forçar a execução manual

jobs:
  run-python:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script de coleta
        run: python coletor.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "Robo de Clima"
          git config --global user.email "robo@febrace.com"
          git add dados_clima.json
          git commit -m "Atualizacao automatica de clima via API" || exit 0
          git push
